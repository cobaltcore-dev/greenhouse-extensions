apiVersion: greenhouse.sap/v1alpha1
kind: PluginDefinition
metadata:
  name: kvm-ha-agent
spec:
  version: 0.1.5
  displayName: KVM HA Agent
  description: "KVM HA Agent to manage KVM hypervisor nodes within a Kubernetes environment."
  helmChart:
    name: kvm-ha-agent-umbrella
    repository: oci://keppel.eu-de-1.cloud.sap/ccloud-helm
    version: 0.1.3
  options:
  - name: global.region
    type: string
    required: true
    description: "OpenStack region"
  - name: global.az
    type: string
    required: true
    description: "OpenStack Availability zone"
  - name: kvm-ha-agent.clientSecret
    type: secret
    required: true
    description: "Client secret for authenticating against the KVM HA service"
  - name: kvm-ha-agent.image.repository
    type: string
    description: "Container image repository for the KVM HA Agent"
  - name: kvm-ha-agent.image.tag
    type: string
    description: "Container image tag for the KVM HA Agent"
  - name: kvm-ha-agent.image.pullPolicy
    type: string
    description: "Image pull policy"
  - name: kvm-ha-agent.dryrun
    type: bool
    default: false
    description: "Run the agent in dry-run mode without reporting to kvm-ha-service"
  - name: kvm-ha-agent.logLevel
    type: string
    default: info
    description: "Log verbosity level"
  - name: kvm-ha-agent.haServiceName
    type: string
    default: kvm-ha-service
    description: "Name of the KVM HA service endpoint"
  - name: kvm-ha-agent.haServicePort
    type: int
    default: 443
    description: "Port of the KVM HA service endpoint"
  - name: kvm-ha-agent.uptimeCheckInterval
    type: int
    default: 30
    description: "Interval in seconds for checking host uptime"
  - name: kvm-ha-agent.libvirt.libvirtInstanceCheckInterval
    type: int
    default: 30
    description: "Interval in seconds for polling libvirt instance state"
  - name: kvm-ha-agent.libvirt.libvirtInstanceCheckInitialDelay
    type: int
    default: 10
    description: "Initial delay in seconds before the first libvirt instance check"
  - name: kvm-ha-agent.libvirt.hypervisors
    type: list
    required: true
    description: "List of hypervisor connection configurations (uri, type, timeouts, domain event filters)"
  - name: kvm-ha-agent.rollingUpdate.maxUnavailable
    type: string
    default: "50%"
    description: "Maximum number or percentage of DaemonSet pods that can be unavailable during a rolling update"
  - name: prometheusRules.create
    required: false
    default: true
    type: bool
    description: " Create Prometheus rules"
  - name: kvm-ha-agent.prometheusRules.ruleSelectors
    required: false
    type: list
    description: "Selector for Prometheus rules to be picked up by the Prometheus operator. List of key-value pairs."
  - name: kvm-ha-agent.prometheusRules.additionalRuleLabels
    type: map
    required: false
    description: "Additional labels to be added every Prometheus rule. E.g support_group, service"
  - name: kvm-ha-agent.dashboards.create
    type: bool
    default: true
    required: false
    description: "Create Perses dashboards"
